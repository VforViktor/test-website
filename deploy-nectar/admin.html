<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nectar — Lead Oversigt</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest: #1C3829;
      --forest-dark: #0F2119;
      --honey: #C9A059;
      --honey-light: #EDD8A8;
      --cream: #FAFAF8;
      --stone-100: #F4F1ED;
      --stone-200: #E8E3DC;
      --stone-500: #8B8B89;
      --stone-900: #1A1A18;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--stone-100);
      color: var(--stone-900);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--forest-dark);
    }

    .login-card {
      background: white;
      border-radius: 12px;
      padding: 48px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .login-card .logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--forest);
      margin-bottom: 4px;
    }

    .login-card .subtitle {
      font-size: 12px;
      color: var(--stone-500);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .login-card label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--stone-900);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .login-card input {
      width: 100%;
      border: 1px solid var(--stone-200);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--stone-900);
      background: var(--stone-100);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 20px;
    }

    .login-card input:focus { border-color: var(--forest); }

    .login-btn {
      width: 100%;
      background: var(--forest);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }

    .login-btn:hover { background: var(--forest-dark); }

    .login-error {
      font-size: 13px;
      color: #dc2626;
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    /* ── DASHBOARD ── */
    #dashboard { display: none; }

    header {
      background: var(--forest);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.04em;
    }

    .header-tag {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .logout-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    main { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--stone-200);
      border-radius: 10px;
      padding: 20px 24px;
    }

    .stat-card .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--stone-500);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-card .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--forest);
    }

    .stat-card .stat-value.honey { color: var(--honey); }

    /* Table */
    .table-card {
      background: white;
      border: 1px solid var(--stone-200);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--stone-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--stone-900);
    }

    .table-header span {
      font-size: 12px;
      color: var(--stone-500);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 12px 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--stone-500);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      background: var(--stone-100);
      border-bottom: 1px solid var(--stone-200);
    }

    tbody tr {
      border-bottom: 1px solid var(--stone-200);
      cursor: pointer;
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #faf9f7; }

    tbody td {
      padding: 14px 20px;
      font-size: 13px;
      color: var(--stone-900);
    }

    .td-name { font-weight: 600; }

    .td-amount {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--forest);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .badge-new { background: #dcfce7; color: #166534; }
    .badge-dot-new { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }
    .badge-pdf { background: #fef3c7; color: #92400e; }
    .badge-dot-pdf { width: 6px; height: 6px; border-radius: 50%; background: #d97706; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--stone-500);
      font-size: 14px;
    }

    /* ── MODAL ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }

    .modal-header {
      background: var(--forest);
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: white;
      font-weight: 600;
    }

    .modal-header p {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .modal-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .modal-close:hover { color: white; }

    .modal-body { padding: 28px; }

    .field-row {
      display: flex;
      border-bottom: 1px solid var(--stone-200);
      padding: 12px 0;
    }

    .field-row:last-child { border-bottom: none; }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--stone-500);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      width: 140px;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .field-value {
      font-size: 14px;
      color: var(--stone-900);
      line-height: 1.5;
    }

    .field-value a { color: var(--forest); text-decoration: none; }
    .field-value a:hover { text-decoration: underline; }

    .field-value.amount {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--forest);
    }

    .modal-actions {
      padding: 20px 28px;
      border-top: 1px solid var(--stone-200);
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      background: var(--forest);
      color: white;
      border: none;
      border-radius: 7px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: white;
      color: var(--stone-900);
      border: 1px solid var(--stone-200);
      border-radius: 7px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    #loading {
      text-align: center;
      padding: 60px;
      color: var(--stone-500);
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">Nectar</div>
    <div class="subtitle">Lead Dashboard · Internt</div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <label>Adgangskode</label>
      <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password" />
      <button type="submit" class="login-btn">Log ind</button>
    </form>
    <div class="login-error" id="login-error">Forkert adgangskode. Prøv igen.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div>
      <span class="header-logo">Nectar</span>
      <span class="header-tag" style="margin-left:12px;">Lead Oversigt</span>
    </div>
    <button class="logout-btn" onclick="logout()">Log ud</button>
  </header>

  <main>
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-label">Totale leads</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nye leads</div>
        <div class="stat-value honey" id="stat-new">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">DKK 10M+</div>
        <div class="stat-value" id="stat-large">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Seneste lead</div>
        <div class="stat-value" id="stat-latest" style="font-size:16px;padding-top:4px;">—</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2>Henvendelser</h2>
        <span id="table-count"></span>
      </div>
      <div id="loading">Henter leads…</div>
      <div id="table-container" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>Navn</th>
              <th>E-mail</th>
              <th>Telefon</th>
              <th>Beløb</th>
              <th>Dato</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="leads-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <h3 id="modal-name">—</h3>
        <p id="modal-date">—</p>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <a id="modal-email-link" href="#" class="btn-primary">✉ Send e-mail</a>
      <button id="modal-reply-btn" class="btn-primary" onclick="markReplied()" style="background:#2B5940;">Markér som svaret</button>
      <button class="btn-secondary" onclick="closeModalDirect()">Luk</button>
    </div>
  </div>
</div>

<script>
  let adminPassword = ''
  let allLeads = []

  function handleLogin(e) {
    e.preventDefault()
    const pw = document.getElementById('password-input').value
    if (!pw) return

    adminPassword = pw
    loadLeads()
  }

  async function loadLeads() {
    try {
      const res = await fetch('/.netlify/functions/get-leads', {
        headers: { 'x-admin-password': adminPassword }
      })

      if (res.status === 401) {
        document.getElementById('login-error').style.display = 'block'
        adminPassword = ''
        return
      }

      allLeads = await res.json()
      showDashboard()
      renderLeads(allLeads)
    } catch (err) {
      document.getElementById('login-error').textContent = 'Forbindelsesfejl. Prøv igen.'
      document.getElementById('login-error').style.display = 'block'
    }
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
  }

  function renderLeads(leads) {
    document.getElementById('loading').style.display = 'none'
    document.getElementById('table-container').style.display = 'block'

    // Stats
    document.getElementById('stat-total').textContent = leads.length
    document.getElementById('stat-new').textContent = leads.filter(l => l.status === 'new').length
    document.getElementById('stat-large').textContent = leads.filter(l => l.investment_amount === '+10MM').length
    document.getElementById('stat-latest').textContent = leads.length
      ? formatDate(leads[0].created_at)
      : '—'
    document.getElementById('table-count').textContent = `${leads.length} henvendelse${leads.length !== 1 ? 'r' : ''}`

    const tbody = document.getElementById('leads-tbody')

    if (leads.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">Ingen leads endnu — formularen er klar til at modtage henvendelser.</div></td></tr>`
      return
    }

    tbody.innerHTML = leads.map((lead, i) => `
      <tr onclick="openModal(${i})">
        <td class="td-name">${escHtml(lead.name)}</td>
        <td>${escHtml(lead.email)}</td>
        <td>${escHtml(lead.phone || '—')}</td>
        <td class="td-amount">${formatAmount(lead.investment_amount)}</td>
        <td style="color:#6B6762;">${formatDate(lead.created_at)}</td>
        <td>${sourceBadge(lead.source)}</td>
      </tr>`).join('')
  }

  let currentLeadIndex = null

  function openModal(index) {
    currentLeadIndex = index
    const lead = allLeads[index]
    document.getElementById('modal-name').textContent = lead.name
    document.getElementById('modal-date').textContent = formatDate(lead.created_at)
    document.getElementById('modal-email-link').href = `mailto:${lead.email}?subject=Ang. din interesse i Nectar Valby Boligfond`

    const fields = [
      ['E-mail', `<a href="mailto:${escHtml(lead.email)}">${escHtml(lead.email)}</a>`],
      ['Telefon', escHtml(lead.phone || '—')],
      ['Virksomhed', escHtml(lead.company || '—')],
      ['Investeringsbeløb', `<span class="amount">${formatAmount(lead.investment_amount)}</span>`],
      ['Type af midler', escHtml(lead.investment_type || '—')],
      ['Besked', escHtml(lead.message || '—')],
      ['Kilde', lead.source === 'hent-investeringsplan' ? 'Hent investeringsplan' : 'Kontaktformular'],
      ['Indsendt', formatDateFull(lead.created_at)],
    ]

    // Email status sektion
    const emailStatus = `
      <div style="margin:20px 0 0;padding:16px;background:#f4f1ed;border-radius:8px;">
        <p style="font-size:11px;font-weight:700;color:#6B6762;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 12px;">E-mail status</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${statusRow('Sendt', lead.email_sent_at)}
          ${statusRow('Leveret', lead.email_delivered_at)}
          ${statusRow('Åbnet', lead.email_opened_at)}
          ${statusRow('Svaret', lead.replied_at)}
        </div>
      </div>`

    // Noter
    const notesSection = `
      <div style="margin-top:16px;">
        <p style="font-size:11px;font-weight:700;color:#6B6762;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px;">Noter</p>
        <textarea id="modal-notes" rows="3" style="width:100%;border:1px solid #E8E3DC;border-radius:6px;padding:10px 12px;font-size:13px;font-family:Inter,sans-serif;color:#1A1A18;background:#FAFAF8;resize:vertical;">${escHtml(lead.notes || '')}</textarea>
        <button onclick="saveNotes()" style="margin-top:6px;background:#1C3829;color:white;border:none;border-radius:6px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;">Gem noter</button>
      </div>`

    document.getElementById('modal-body').innerHTML =
      fields.map(([label, value]) => `
        <div class="field-row">
          <div class="field-label">${label}</div>
          <div class="field-value">${value}</div>
        </div>`).join('') + emailStatus + notesSection

    // Opdatér knap i modal-actions
    const replyBtn = document.getElementById('modal-reply-btn')
    if (lead.replied_at) {
      replyBtn.textContent = '✓ Markeret som svaret'
      replyBtn.style.background = '#166534'
    } else {
      replyBtn.textContent = 'Markér som svaret'
      replyBtn.style.background = ''
    }

    document.getElementById('modal-overlay').classList.add('open')
  }

  function statusRow(label, timestamp) {
    const ok = !!timestamp
    const color = ok ? '#166534' : '#9B9996'
    const icon = ok ? '✓' : '○'
    const time = ok ? `<span style="font-size:11px;color:#6B6762;margin-left:8px;">${formatDateFull(timestamp)}</span>` : ''
    return `<div style="display:flex;align-items:center;gap:6px;">
      <span style="color:${color};font-size:13px;font-weight:700;">${icon}</span>
      <span style="font-size:13px;color:${color};font-weight:${ok ? '600' : '400'};">${label}</span>
      ${time}
    </div>`
  }

  async function markReplied() {
    if (currentLeadIndex === null) return
    const lead = allLeads[currentLeadIndex]
    const isReplied = !!lead.replied_at

    await fetch('/.netlify/functions/update-lead', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ id: lead.id, replied: !isReplied }),
    })

    // Opdatér lokalt og genåbn modal
    allLeads[currentLeadIndex].replied_at = isReplied ? null : new Date().toISOString()
    openModal(currentLeadIndex)
  }

  async function saveNotes() {
    if (currentLeadIndex === null) return
    const lead = allLeads[currentLeadIndex]
    const notes = document.getElementById('modal-notes').value

    await fetch('/.netlify/functions/update-lead', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ id: lead.id, notes }),
    })

    allLeads[currentLeadIndex].notes = notes
    const btn = document.querySelector('#modal-body button[onclick="saveNotes()"]')
    if (btn) { btn.textContent = 'Gemt ✓'; setTimeout(() => { btn.textContent = 'Gem noter' }, 2000) }
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModalDirect()
  }

  function closeModalDirect() {
    document.getElementById('modal-overlay').classList.remove('open')
  }

  function logout() {
    adminPassword = ''
    allLeads = []
    document.getElementById('dashboard').style.display = 'none'
    document.getElementById('login-screen').style.display = 'flex'
    document.getElementById('password-input').value = ''
    document.getElementById('login-error').style.display = 'none'
  }

  function formatAmount(val) {
    const map = { '2.5-5M': 'DKK 2,5 – 5M', '5-10M': 'DKK 5 – 10M', '+10MM': 'DKK 10M+' }
    return map[val] || val || '—'
  }

  function formatDate(iso) {
    if (!iso) return '—'
    return new Date(iso).toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' })
  }

  function formatDateFull(iso) {
    if (!iso) return '—'
    return new Date(iso).toLocaleString('da-DK', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })
  }

  function sourceBadge(source) {
    if (source === 'hent-investeringsplan') {
      return `<span class="badge badge-pdf"><span class="badge-dot-pdf"></span>Hent investeringsplan</span>`
    }
    return `<span class="badge badge-new"><span class="badge-dot-new"></span>Kontakt</span>`
  }

  function escHtml(str) {
    if (!str) return ''
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }
</script>
</body>
</html>
